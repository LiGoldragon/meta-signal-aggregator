[package]
name         = "meta-signal-aggregator"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/meta-signal-aggregator"
description  = "Meta Signal configuration contract for aggregator."
publish      = false

[lib]
name = "meta_signal_aggregator"
path = "src/lib.rs"

[features]
default = ["dotos-text"]
dotos-text = ["signal-frame/dotos-text", "signal-aggregator/dotos-text"]

[dependencies]
dotos              = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "1facca44fbcb" }
signal-frame      = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-aggregator = { git = "https://github.com/LiGoldragon/signal-aggregator", branch = "main" }
rkyv              = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror         = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
